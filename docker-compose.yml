services:
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediflow-dev-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes:
  postgres_data:
